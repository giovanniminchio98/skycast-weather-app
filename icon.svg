<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- sky: vivid iOS-blue vertical gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b63c9"/>
      <stop offset="0.55" stop-color="#3f93e8"/>
      <stop offset="1" stop-color="#6fb4ee"/>
    </linearGradient>
    <!-- sun: warm radial -->
    <radialGradient id="sun" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.55" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ffa61e"/>
    </radialGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <!-- cloud: white with a cool blue underside -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f2f7fd"/>
      <stop offset="1" stop-color="#cfe0f2"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="115"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- faint high stars, echoing the app's night sky -->
    <g fill="#ffffff">
      <circle cx="82"  cy="70"  r="4" opacity="0.5"/>
      <circle cx="150" cy="44"  r="3" opacity="0.4"/>
      <circle cx="452" cy="96"  r="4" opacity="0.45"/>
      <circle cx="405" cy="52"  r="3" opacity="0.35"/>
    </g>

    <!-- sun peeking from behind the cloud -->
    <circle cx="208" cy="196" r="150" fill="url(#sunglow)"/>
    <g stroke="#ffcf3f" stroke-width="17" stroke-linecap="round" opacity="0.95">
      <line x1="208" y1="72"  x2="208" y2="104"/>
      <line x1="121" y1="109" x2="143" y2="131"/>
      <line x1="295" y1="109" x2="273" y2="131"/>
      <line x1="84"  y1="196" x2="116" y2="196"/>
      <line x1="300" y1="196" x2="332" y2="196"/>
      <line x1="121" y1="283" x2="143" y2="261"/>
    </g>
    <circle cx="208" cy="196" r="84" fill="url(#sun)"/>

    <!-- the SkyCast touch: a "cast" beacon on the cloud, signal arcs beaming out -->
    <g fill="none" stroke="#8ce0ff" stroke-linecap="round">
      <path d="M334 210 A42 42 0 0 1 376 252" stroke-width="14" opacity="0.95"/>
      <path d="M334 182 A70 70 0 0 1 404 252" stroke-width="14" opacity="0.55"/>
    </g>
    <circle cx="334" cy="252" r="13" fill="#8ce0ff"/>

    <!-- fluffy cloud -->
    <g>
      <path fill="url(#cloud)" d="
        M118 400
        a56 56 0 0 1 6 -111
        a76 76 0 0 1 143 -34
        a62 62 0 0 1 90 20
        a58 58 0 0 1 43 103
        a34 34 0 0 1 -30 22
        Z"/>
      <!-- soft shadow tucking the cloud base -->
      <ellipse cx="250" cy="399" rx="180" ry="14" fill="#3a6db3" opacity="0.30"/>
    </g>

    <!-- one cyan raindrop, hinting at the forecast side -->
    <path d="M322 416 C322 416 342 440 342 454 A20 20 0 0 1 302 454 C302 440 322 416 322 416 Z" fill="#7ddafd"/>
  </g>
</svg>
